[project]
name = "fontmix"
version = "0.1.0"
license = "GPL-3.0-or-later"  # the build scripts; the fonts and font sources are OFL-1.1 (see OFL.txt)
requires-python = ">=3.14"
dependencies = [
    "fonttools[unicode,woff]>=4.66.0",
    "freetype-py>=2.5.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "skia-pathops>=0.9.2",
    "ttfautohint-py>=0.6.1",
    "ufolib2>=0.18.1",
    "uharfbuzz>=0.56.2",
]

[dependency-groups]
dev = [
    "opentype-sanitizer>=9.2.0",
]
